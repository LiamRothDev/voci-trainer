<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voci-Trainer</title>
  <meta name="description" content="Vokabeln lernen mit Karteikarten, Lernen, Test und Zuordnen – im Browser, auch offline.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">

  </script>

  <script src="js/views/learn.js"></script>
  <script src="js/views/test.js"></script>
